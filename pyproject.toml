[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stack"
version = "0.1.0"
description = "A simple, layered configuration library with dot-notation access."
readme = "README.md"
authors = [{ name = "Sahan Lakshitha", email = "sahanlskh@gmail.com" }]
maintainers = [{ name = "Sahan Lakshitha", email = "sahnlskh@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.6"
dependencies = []
keywords = ["config", "settings", "environment", "yaml", "toml"]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
toml = ["tomli>=2.0.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/sahanlk/stack"

[project.scripts]
stack = "stack.cli:main"
